[workspace]
members = ["migration", "entity", ".", "fpzip-sys", "macros"]

[package]
name = "dtm"
version = "0.6.0"
description = "A little app for reading Draw Things Metadata"
authors = ["kcjerrell"]
edition = "2021"

[lib]
name = "dtm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.2"

[dependencies]
# Local Modules
entity = { path = "./entity" }
migration = { path = "./migration" }
fpzip-sys = { path = "./fpzip-sys" }
dtm_macros = { path = "./macros" }

# Core Tauri
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }

# Tauri Plugins (all GitHub v2 versions)
# Ensures a single consistent dependency tree
tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2", features = ["watch"] }
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-clipboard-manager = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-valtio = "3"
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }

# Third-party / utility crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
little_exif = "0.6.23"
web-image-meta = "0.2.1"
chrono = { version = "0.4", features = ["serde"] }
flatbuffers = "25.12.19"
sqlx = { version = "0.9", features = ["runtime-async-std", "tls-native-tls", "sqlite"] }
sea-orm = { version = "2.0.0-rc.41", features = [
  "sqlx-sqlite",
  "runtime-async-std-native-tls",
  "macros",
  "sqlite-use-returning-for-3_35",
#  "debug-print"
] }
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["full"] }
mime = "0.3.17"
once_cell = "1.21.4"
bytes = "1.12.0"
byteorder = "1.5.0"
half = "2"
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0.103"
num_enum = "0.7.6"
base64 = "0.23"
flate2 = "1.1.9"
png = "0.18.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sea-query = "1.0.1"
unicode-normalization = "0.1.25"
log = "0.4"
tauri-plugin-log = "2"
sevenz-rust = "0.6.1"
sha2 = "0.11.0"
futures-util = "0.3.32"
regex = "1.12.4"
walkdir = "2.5.0"
async-trait = "0.1.89"
notify-debouncer-mini = { version = "0.7.0", features = ["macos_fsevent"] }
dashmap = "6.2.1"
hound = "3.5.1"
semver = "1.0.28"
hex = "0.4.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
itertools = "0.15.0"
zip = "8.6"
img-parts = "0.4"
tauri-plugin-os = "2"
strum = { version = "0.28.0", features = ["derive"] }
fpzip-rs = "0.1.0"
tempfile = "3.27.0"
s-zip = { version = "0.11.3", features = ["async"] }
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1.3.0"

# macOS-only
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }

[dev-dependencies]
tempfile = "3.27.0"
