name: pr-e2e

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  e2e:
    name: Build Debug App + WDIO E2E
    runs-on: macos-26
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install gexiv2 (rexiv2 dependency)
        run: |
          brew install gexiv2
          echo "---- gexiv2 .pc files under $(brew --prefix) ----"
          find "$(brew --prefix)" -name 'gexiv2*.pc' -o -name 'exiv2*.pc' 2>/dev/null || true
          GEXIV2_PC="$(find "$(brew --prefix)" -name 'gexiv2.pc' 2>/dev/null | head -1)"
          EXIV2_PC="$(find "$(brew --prefix)" -name 'exiv2.pc' 2>/dev/null | head -1)"
          if [ -z "$GEXIV2_PC" ]; then echo "ERROR: gexiv2.pc not found"; exit 1; fi
          echo "PKG_CONFIG_PATH=$(dirname "$GEXIV2_PC"):$(dirname "${EXIV2_PC:-$GEXIV2_PC}"):${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Restore Rust cache
        id: rust-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run gen-icons
        
      - name: Build debug app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:debug

      - name: Set up test data
        run: sh scripts/test-setup.sh

      - name: Run WDIO tests
        run: npm run wdio

      - name: Upload WDIO failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wdio-failure-screenshots
          path: test/artifacts/screenshots
          if-no-files-found: ignore

      - name: Upload app logs and sync state
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-logs-and-sync-state
          path: |
            ~/Library/Logs/com.kcjer.dtm
            ~/Library/Application Support/com.kcjer.dtm

            !**/*.7z
            !**/bin/**
          if-no-files-found: ignore

      - name: Save Rust cache
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.rust-cache-restore.outputs.cache-primary-key }}
