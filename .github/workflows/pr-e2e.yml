name: pr-e2e

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck + Web Tests
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Run web tests
        run: npm run test:web

  rust:
    name: Rust Tests
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        id: rust-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run gen-icons

      - name: Set up Rust test data
        working-directory: src-tauri
        run: bash ./test-setup.sh

      - name: Run Rust tests
        run: npm run test:rust

  wdio:
    name: WDIO Tests
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        id: rust-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run gen-icons

      - name: Build E2E app
        run: npm run build:e2e

      - name: Set up WDIO test data
        run: bash scripts/test-setup.sh

      - name: Run WDIO tests
        run: npm run test:wdio

      - name: Upload WDIO failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wdio-failure-screenshots
          path: test/artifacts/screenshots
          if-no-files-found: ignore

      - name: Upload app logs and sync state
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-logs-and-sync-state
          path: |
            ~/Library/Logs/com.kcjer.dtm
            ~/Library/Application Support/com.kcjer.dtm
